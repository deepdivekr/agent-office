[project]
name = "agent-office-media"
version = "0.1.0"
description = "Agent Office media executor: transcription, subtitled video and narration for a Work's files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# Local speech-to-text (MIT). Downloads its model on first use.
whisper = ["faster-whisper>=1.1.1,<2"]
# Narration through Microsoft Edge's online voices (LGPL-3.0, an unofficial endpoint that may change).
tts = ["edge-tts>=7.2,<8"]

[project.scripts]
agent-office-media = "agent_office_media.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
