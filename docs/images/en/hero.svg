<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>Bots and automations scattered across AI clients, managed on one Agent Office screen</title>
<style>.t{fill:#e6e9ee} .d{fill:#9aa3ad} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001s!important;} }
.k0{animation:k0 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k0{0%,14%{transform:translate(0,0)} 30%,95%{transform:translate(472px,16px)} 100%{transform:translate(0,0)}}
.k1{animation:k1 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k1{0%,16%{transform:translate(0,0)} 32%,95%{transform:translate(483px,16px)} 100%{transform:translate(0,0)}}
.k2{animation:k2 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k2{0%,18%{transform:translate(0,0)} 34%,95%{transform:translate(347px,-94px)} 100%{transform:translate(0,0)}}
.k3{animation:k3 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k3{0%,20%{transform:translate(0,0)} 36%,95%{transform:translate(608px,-94px)} 100%{transform:translate(0,0)}}
.k4{animation:k4 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k4{0%,22%{transform:translate(0,0)} 38%,95%{transform:translate(472px,-164px)} 100%{transform:translate(0,0)}}
.k5{animation:k5 10s cubic-bezier(.4,0,.2,1) infinite} @keyframes k5{0%,24%{transform:translate(0,0)} 40%,95%{transform:translate(608px,-164px)} 100%{transform:translate(0,0)}}
.cap1{animation:cap1 10s infinite} @keyframes cap1{0%{opacity:0} 4%,24%{opacity:1} 32%,100%{opacity:0}}
.cap2{animation:cap2 10s infinite} @keyframes cap2{0%,38%{opacity:0} 46%,62%{opacity:1} 68%,100%{opacity:0}}
.cap3{animation:cap3 10s infinite} @keyframes cap3{0%,70%{opacity:0} 76%,95%{opacity:1} 100%{opacity:0}}
.toast{animation:toast 10s infinite} @keyframes toast{0%,40%{opacity:0;transform:translateY(-8px)} 46%,95%{opacity:1;transform:translateY(0)} 100%{opacity:0}}
.board{animation:board 10s infinite} @keyframes board{0%,20%{opacity:.35} 34%,100%{opacity:1}}
.arrow{stroke-dasharray:6 6;animation:arrow 10s infinite} @keyframes arrow{0%,68%{opacity:0;stroke-dashoffset:120} 76%,95%{opacity:1;stroke-dashoffset:0} 100%{opacity:0}}
.badge{animation:badge 10s infinite} @keyframes badge{0%,74%{opacity:0} 80%,95%{opacity:1} 100%{opacity:0}}
.q{animation:q 10s infinite} @keyframes q{0%,2%{opacity:0} 6%,22%{opacity:1} 28%,100%{opacity:0}}
.pulse{animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}</style>
<rect width="960" height="440" fill="#101317"/>
<text x="40" y="38" class="t" font-size="17" font-weight="700">Bots scattered across clients → one screen</text>
<rect x="40" y="70" width="250" height="86" rx="10" fill="#161a20" stroke="#2a2f37"/>
<text x="54" y="94" class="t" font-size="13" font-weight="600">Codex</text>
<rect x="40" y="180" width="250" height="86" rx="10" fill="#161a20" stroke="#2a2f37"/>
<text x="54" y="204" class="t" font-size="13" font-weight="600">Claude Code</text>
<rect x="40" y="290" width="250" height="86" rx="10" fill="#161a20" stroke="#2a2f37"/>
<text x="54" y="314" class="t" font-size="13" font-weight="600">Hermes · scripts</text>
<g class="q"><text x="270" y="94" class="d" font-size="14">?</text><text x="270" y="204" class="d" font-size="14">?</text><text x="270" y="314" class="d" font-size="14">?</text></g>
<g class="board"><rect x="370" y="60" width="550" height="330" rx="12" fill="#161a20" stroke="#2a2f37"/>
<text x="394" y="90" class="t" font-size="15" font-weight="700">Agent Office</text><text x="896" y="90" class="d mono" font-size="11" text-anchor="end">Work board</text>
<text x="395.0" y="116" fill="#e5484d" font-size="12" font-weight="600" class="mono">Needs you</text><line x1="395.0" y1="122" x2="506.0" y2="122" stroke="#2a2f37"/>
<text x="520.0" y="116" fill="#3dd68c" font-size="12" font-weight="600" class="mono">Running</text><line x1="520.0" y1="122" x2="631.0" y2="122" stroke="#2a2f37"/>
<text x="645.0" y="116" fill="#9aa3ad" font-size="12" font-weight="600" class="mono">Queued</text><line x1="645.0" y1="122" x2="756.0" y2="122" stroke="#2a2f37"/>
<text x="770.0" y="116" fill="#6ea8fe" font-size="12" font-weight="600" class="mono">Done</text><line x1="770.0" y1="122" x2="881.0" y2="122" stroke="#2a2f37"/>
</g>
<path class="arrow" d="M 370 350 C 330 350, 330 140, 294 140" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
<g class="badge"><rect x="216" y="126" width="62" height="18" rx="9" fill="#e8a33d" fill-opacity=".15" stroke="#e8a33d"/><text x="247" y="139" fill="#e8a33d" font-size="10" text-anchor="middle" font-weight="600">runs here</text></g>
<path class="arrow" d="M 370 350 C 330 350, 330 250, 294 250" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
<g class="badge"><rect x="216" y="236" width="62" height="18" rx="9" fill="#e8a33d" fill-opacity=".15" stroke="#e8a33d"/><text x="247" y="249" fill="#e8a33d" font-size="10" text-anchor="middle" font-weight="600">runs here</text></g>
<path class="arrow" d="M 370 350 C 330 350, 330 360, 294 360" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
<g class="badge"><rect x="216" y="346" width="62" height="18" rx="9" fill="#e8a33d" fill-opacity=".15" stroke="#e8a33d"/><text x="247" y="359" fill="#e8a33d" font-size="10" text-anchor="middle" font-weight="600">runs here</text></g>
<g transform="translate(54,114)"><g class="k0"><rect width="104" height="26" rx="13" fill="#101317" stroke="#2a2f37"/><text x="52" y="17" class="t" font-size="11" text-anchor="middle">News digest</text></g></g>
<g transform="translate(168,114)"><g class="k1"><rect width="104" height="26" rx="13" fill="#101317" stroke="#2a2f37"/><text x="52" y="17" class="t" font-size="11" text-anchor="middle">Price watch</text></g></g>
<g transform="translate(54,224)"><g class="k2"><rect width="104" height="26" rx="13" fill="#101317" stroke="#e5484d"/><text x="12" y="17" class="t" font-size="11" text-anchor="start">Report filing</text><circle cx="90" cy="13" r="4" fill="#e5484d" class="pulse"/></g></g>
<g transform="translate(168,224)"><g class="k3"><rect width="104" height="26" rx="13" fill="#101317" stroke="#2a2f37"/><text x="52" y="17" class="t" font-size="11" text-anchor="middle">Data pull</text></g></g>
<g transform="translate(54,334)"><g class="k4"><rect width="104" height="26" rx="13" fill="#101317" stroke="#2a2f37"/><text x="52" y="17" class="t" font-size="11" text-anchor="middle">Weekly brief</text></g></g>
<g transform="translate(168,334)"><g class="k5"><rect width="104" height="26" rx="13" fill="#101317" stroke="#2a2f37"/><text x="52" y="17" class="t" font-size="11" text-anchor="middle">Form entry</text></g></g>
<g class="toast"><rect x="670" y="332" width="226" height="38" rx="8" fill="#e5484d" fill-opacity=".12" stroke="#e5484d"/><text x="683" y="355" class="t" font-size="12" font-weight="600">⚠ 1 stopped · messenger alert</text></g>
<text x="480.0" y="418" class="cap1 d" font-size="14" text-anchor="middle">What is running? Where did it stop? You open each client to find out</text>
<text x="480.0" y="418" class="cap2 t" font-size="14" text-anchor="middle" font-weight="600">Status, stop alerts and instruction changes in one place</text>
<text x="480.0" y="418" class="cap3" fill="#e8a33d" font-size="14" text-anchor="middle" font-weight="600">Execution stays with each client and your own accounts</text>
</svg>